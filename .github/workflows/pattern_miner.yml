name: Patern madenciliği

on:
  workflow_dispatch:
    inputs:
      finra:
        description: "FINRA short hacim geçmişi indirilsin mi (evet / hayir)"
        required: false
        default: "evet"
      saat:
        description: "1 saatlik mumlardan balina izleri (evet / hayir)"
        required: false
        default: "evet"

permissions:
  contents: write

concurrency:
  group: patern-madenciligi
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt scikit-learn
      - name: Büyük hareket öncesi örgüyü ara
        run: >
          python tools/pattern_miner.py
          --finra "${{ github.event.inputs.finra }}"
          --saat "${{ github.event.inputs.saat }}"
        continue-on-error: true
      - name: Sonuç dosyası (indirilebilir)
        uses: actions/upload-artifact@v4
        with:
          name: patern_madenciligi
          path: data/patterns/
          if-no-files-found: warn
      - name: Sonuçları repoya kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/patterns/ || true
          git diff --cached --quiet || git commit -m "Patern madenciliği sonuçları"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
