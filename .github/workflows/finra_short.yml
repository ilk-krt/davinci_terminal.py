name: Akşam hesabı (FINRA, kripto, likidite, sinyaller)

on:
  schedule:
    # ABD piyasa kapanışından sonra (FINRA dosyası ~22:00 UTC yayımlanır)
    - cron: "30 23 * * 1-5"
    - cron: "30 11 * * 2-6"   # yedek: ertesi sabah
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

concurrency:                  # iki çalıştırma üst üste binmesin
  group: aksam-hesabi
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: FINRA short hacmi
        run: python tools/finra_update.py
        continue-on-error: true
      - name: Kripto endeksleri ve Fed likiditesi
        run: python tools/macro_update.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # isteğe bağlı
      - name: Sinyaller, tarama, karar, bilanço (snapshot)
        run: python tools/build_snapshot.py
        continue-on-error: true
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Akşam hesabı: veri ve sinyaller güncellendi"
          # bu arada repoya başka dosya yüklendiyse önce onları al
          git pull --rebase --autostash origin main
          git push origin HEAD:main
