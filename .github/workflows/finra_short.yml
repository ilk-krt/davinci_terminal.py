name: FINRA short hacim güncelle

on:
  schedule:
    # ABD piyasa kapanışından sonra (FINRA dosyası ~22:00 UTC yayımlanır)
    - cron: "30 23 * * 1-5"
    - cron: "30 11 * * 2-6"   # yedek: ertesi sabah
  workflow_dispatch: {}       # Actions sekmesinden elle çalıştırma

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python tools/finra_update.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/finra_short.csv.gz
          git diff --cached --quiet || git commit -m "FINRA short hacim verisi güncellendi"
          git push
